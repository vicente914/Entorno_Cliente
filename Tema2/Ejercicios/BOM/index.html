<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorado BOM</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <h1> &#127757 Explorador del BOM</h1>

    <div class="secciones">
        <h2>&#128203 Información del navegador</h2>
        <ul>
            <li id="navegador"></li>
            <li id="idioma"></li>
            <li id="plataforma"></li>
            <li id="resolucion"></li>
        </ul>
    </div>

    <div class="secciones">
        <h2>&#129517 Navegación</h2>
        <p id="urlActual"></p>
    </div>

    <div class="secciones">
        <h2>&#128279 Redirección</h2>
        <button id="urlW3"></button>
    </div>

    <div class="secciones">
        <h2>&#128187 Información de la pantalla</h2>
        <ul>
            <li id="resolucionTotal"></li>
            <li id="areaDisponible"></li>
            <li id="orientacion"></li>
            <li id="profundidadColor"></li>
            <li id="profundidadPixel"></li>
        </ul>
    </div>
</body>
</html>
