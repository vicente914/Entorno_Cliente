<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación formularios</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="contenedorPrincipal">
        <h2>Probando expresiones regulares</h2>

        <div id="comprobaciones">
            <p>
                <label>Validación de mayuscula:</label>
                <input id="probarTexto" type="text">
                <button type="submit" id="comprobarMayus">Comprobar</button>
                <label id="resultadoMayus"></label>
                
            </p>

            <p>
                <label>Validación caraceteres especiales:</label>
                <input id="probarEspec" type="text">
                <button type="submit" id="comprobarEspec">Comprobar</button>
                <label id="resultadoEspec"></label>
            </p>

            <p>
                <label>Validación de correo:</label>
                <input id="probarCorreo" type="text">
                <button type="submit" id="comprobarCorreo">Comprobar</button>
                <label id="resultadoCorreo"></label>
            </p>

            <p>
                <label>Validación de tarjeta de credito:</label>
                <input id="probarTarjeta" type="text">
                <button type="submit" id="comprobarTarjeta">Comprobar</button>
                <label id="resultadoTarjeta"></label>
            </p>

            <p>
                <label>Validación longitud:</label>
                <input id="probarLongitud" type="text">
                <button type="submit" id="comprobarLongitud">Comprobar</button>
                <label id="resultadoLongitud"></label>
            </p>

            <p>
                <label>Validación numero:</label>
                <input id="probarNumero" type="text">
                <button type="submit" id="comprobarNumero">Comprobar</button>
                <label id="resultadoNumero"></label>
            </p>
        </div>
    </div>
</body>
</html>
